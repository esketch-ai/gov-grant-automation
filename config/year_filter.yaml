# REQ-009 · 2026 전용 연도 필터
# 2025년 이하 공고는 100% 드롭, 2026 공고만 유지(정제 계층 집중 게이트)
year_filter:
  target_year: 2026          # 타겟연도 (main이 os.environ TARGET_YEAR 또는 당해년으로 오버라이드 가능)
  allow_no_year: false       # 연도 미기재 공고 드롭 여부 (엄격 2026 모드에서는 true로 드롭)
  mode: strict               # strict: 최신연도<target 이면 드롭 / lenient: 타겟년 언급이면 유지
