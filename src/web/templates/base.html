<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SSHAI-CWA 2026 관리자{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap');
    body { font-family: 'Pretendard', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
  <!-- 상단 네비게이션 헤더 -->
  <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16">
      <div class="flex items-center space-x-3">
        <span class="bg-blue-600 text-white text-xs font-bold px-2.5 py-1 rounded-full uppercase tracking-wider">2026 전용</span>
        <a href="/dashboard" class="text-xl font-bold tracking-tight text-white hover:text-blue-400 flex items-center gap-2">
          <i class="fa-solid fa-file-shield text-blue-500"></i> SSHAI-CWA <span class="text-xs text-slate-400 font-normal">v1.1.0</span>
        </a>
      </div>
      <nav class="flex space-x-1 sm:space-x-4 text-sm font-medium">
        <a href="/dashboard" class="px-3 py-2 rounded-md hover:bg-slate-800 transition {% if active_page == 'dashboard' %}bg-slate-800 text-blue-400 font-semibold{% else %}text-slate-300{% endif %}">
          <i class="fa-solid fa-chart-pie mr-1.5"></i>대시보드
        </a>
        <a href="/announcements" class="px-3 py-2 rounded-md hover:bg-slate-800 transition {% if active_page == 'announcements' %}bg-slate-800 text-blue-400 font-semibold{% else %}text-slate-300{% endif %}">
          <i class="fa-solid fa-bullhorn mr-1.5"></i>공고 관리
        </a>
        <a href="/items" class="px-3 py-2 rounded-md hover:bg-slate-800 transition {% if active_page == 'items' %}bg-slate-800 text-blue-400 font-semibold{% else %}text-slate-300{% endif %}">
          <i class="fa-solid fa-folder-tree mr-1.5"></i>사업 아이템
        </a>
        <a href="/matches" class="px-3 py-2 rounded-md hover:bg-slate-800 transition {% if active_page == 'matches' %}bg-slate-800 text-blue-400 font-semibold{% else %}text-slate-300{% endif %}">
          <i class="fa-solid fa-paper-plane mr-1.5"></i>발송 이력
        </a>
        <a href="/audit" class="px-3 py-2 rounded-md hover:bg-slate-800 transition {% if active_page == 'audit' %}bg-slate-800 text-indigo-400 font-semibold{% else %}text-slate-300{% endif %}">
          <i class="fa-solid fa-shield-halved mr-1.5"></i>품질 검수
        </a>
        <a href="/logs" class="px-3 py-2 rounded-md hover:bg-slate-800 transition {% if active_page == 'logs' %}bg-slate-800 text-amber-400 font-semibold{% else %}text-slate-300{% endif %}">
          <i class="fa-solid fa-terminal mr-1.5"></i>시스템 로그
        </a>
      </nav>
      <div class="flex items-center space-x-3">
        <button id="runBtn" onclick="triggerPipeline()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-3 py-2 rounded-md shadow flex items-center gap-1.5 transition">
          <i class="fa-solid fa-play"></i> 파이프라인 수동 실행
        </button>
      </div>
    </div>
  </header>

  <!-- 메인 컨텐츠 영역 -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    {% block content %}{% endblock %}
  </main>

  <!-- 푸터 -->
  <footer class="bg-white border-t border-slate-200 py-4 mt-auto text-center text-xs text-slate-500">
    <p>SSHAI-CWA Carbon Work Agent &middot; 2026 정부지원사업/R&D 자동 매칭 거버넌스 시스템</p>
  </footer>

  <script>
    async function triggerPipeline() {
      const btn = document.getElementById('runBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 실행 중...';
      try {
        const res = await fetch('/api/pipeline/run', { method: 'POST' });
        const data = await res.json();
        alert('파이프라인 실행 완료: ' + (data.message || JSON.stringify(data)));
        window.location.reload();
      } catch (err) {
        alert('실행 요청 오류: ' + err);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-play"></i> 파이프라인 수동 실행';
      }
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
