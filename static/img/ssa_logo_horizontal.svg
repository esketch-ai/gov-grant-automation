<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 48" width="280" height="48" fill="none">
  <defs>
    <linearGradient id="hBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#080E1D" />
    </linearGradient>
    <linearGradient id="hBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#256EF4" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="hRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#256EF4" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
  </defs>

  <!-- Symbol Icon (38x38) -->
  <g transform="translate(2, 5)">
    <rect x="0" y="0" width="38" height="38" rx="10" fill="url(#hBgGrad)" stroke="url(#hBorderGrad)" stroke-width="1.5" />
    <circle cx="19" cy="19" r="10" fill="#256EF4" opacity="0.25" />
    <!-- Monogram Curves -->
    <path d="M12 25 C10 21, 10 17, 14 14 C17 12, 21 13, 20 16 C19 19, 15 20, 15 23 C15 26, 17 28, 21 28 C25 28, 28 25, 28 21" 
          stroke="url(#hRibbon)" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M26 13 C28 17, 28 21, 24 24 C21 26, 17 25, 18 22 C19 19, 23 18, 23 15 C23 12, 21 10, 17 10" 
          stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <!-- AI Star -->
    <path d="M26 8 Q26 10 28 10 Q26 10 26 12 Q26 10 24 10 Q26 10 26 8 Z" fill="#67E8F9" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(48, 14)">
    <!-- Main Title -->
    <text x="0" y="14" font-family="'Pretendard Variable', -apple-system, sans-serif" font-size="16" font-weight="900" fill="url(#textGrad)" letter-spacing="-0.5px">
      모두의 창업비서
    </text>
    
    <!-- SSA Badge -->
    <rect x="108" y="2" width="32" height="15" rx="3.5" fill="#06B6D4" fill-opacity="0.15" stroke="#06B6D4" stroke-opacity="0.4" stroke-width="0.8" />
    <text x="124" y="13" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#38BDF8" text-anchor="middle" letter-spacing="0.5px">
      SSA
    </text>
    
    <!-- Subtitle (English Slogan) -->
    <text x="0" y="27" font-family="'JetBrains Mono', sans-serif" font-size="9" font-weight="600" fill="#94A3B8" letter-spacing="0.2px">
      Startup Secretary for All
    </text>
  </g>
</svg>